<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="PausenPlay store floor plan">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0c0c0c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      .zlabel { font-family: 'Bebas Neue', 'Barlow Condensed', Impact, sans-serif; letter-spacing: 3px; }
      .tiny { font-family: 'Space Mono', ui-monospace, monospace; }
    </style>
  </defs>

  <!-- floor -->
  <rect width="1000" height="620" fill="url(#floor)"/>
  <rect width="1000" height="620" fill="url(#grid)"/>
  <rect x="10" y="10" width="980" height="600" fill="none" stroke="#FF6B00" stroke-opacity="0.55" stroke-width="3" rx="10"/>
  <rect x="20" y="20" width="960" height="580" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" rx="6"/>

  <!-- glow accents -->
  <ellipse cx="250" cy="186" rx="200" ry="110" fill="#FF6B00" opacity="0.10" filter="url(#soft)"/>
  <ellipse cx="750" cy="186" rx="200" ry="110" fill="#FFD700" opacity="0.07" filter="url(#soft)"/>
  <ellipse cx="250" cy="446" rx="200" ry="110" fill="#44FF88" opacity="0.06" filter="url(#soft)"/>
  <ellipse cx="750" cy="446" rx="200" ry="110" fill="#CC44FF" opacity="0.07" filter="url(#soft)"/>

  <!-- ================= TOP STRIP: RECEPTION + ENTRANCE ================= -->
  <g>
    <rect x="30" y="26" width="300" height="34" rx="6" fill="#1c1c1c" stroke="#FF6B00" stroke-opacity="0.35"/>
    <text class="zlabel" x="180" y="50" font-size="20" fill="#FFD700" text-anchor="middle">RECEPTION / COUNTER</text>

    <g transform="translate(770 26)">
      <rect x="0" y="0" width="200" height="34" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-dasharray="6 6"/>
      <text class="zlabel" x="100" y="23" font-size="20" fill="#F5F0E8" text-anchor="middle">MAIN ENTRANCE</text>
      <path d="M100 42 L100 56 M92 50 L100 58 L108 50" stroke="#FF6B00" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ================= ZONE A — PS5 ================= -->
  <g>
    <rect x="30" y="74" width="440" height="224" rx="10" fill="#ffffff" fill-opacity="0.025" stroke="#FF6B00" stroke-opacity="0.45" stroke-width="2"/>
    <text class="zlabel" x="46" y="98" font-size="19" fill="#FF6B00">PS5 ZONE</text>
    <!-- desks -->
    <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
      <rect x="62" y="98" width="186" height="108" rx="8"/>
      <rect x="262" y="98" width="186" height="108" rx="8"/>
      <rect x="62" y="197" width="186" height="108" rx="8"/>
      <rect x="262" y="197" width="186" height="108" rx="8"/>
    </g>
    <g stroke="#FF6B00" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
      <line x1="94" y1="118" x2="216" y2="118"/>
      <line x1="294" y1="118" x2="416" y2="118"/>
      <line x1="94" y1="217" x2="216" y2="217"/>
      <line x1="294" y1="217" x2="416" y2="217"/>
    </g>
  </g>

  <!-- ================= ZONE B — PC ================= -->
  <g>
    <rect x="530" y="74" width="440" height="224" rx="10" fill="#ffffff" fill-opacity="0.025" stroke="#FFD700" stroke-opacity="0.45" stroke-width="2"/>
    <text class="zlabel" x="546" y="98" font-size="19" fill="#FFD700">PC BATTLESTATION</text>
    <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
      <rect x="562" y="98" width="186" height="108" rx="8"/>
      <rect x="762" y="98" width="186" height="108" rx="8"/>
      <rect x="562" y="197" width="186" height="108" rx="8"/>
      <rect x="762" y="197" width="186" height="108" rx="8"/>
    </g>
    <g stroke="#FFD700" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
      <line x1="594" y1="118" x2="716" y2="118"/>
      <line x1="794" y1="118" x2="916" y2="118"/>
      <line x1="594" y1="217" x2="716" y2="217"/>
      <line x1="794" y1="217" x2="916" y2="217"/>
    </g>
  </g>

  <!-- ================= ZONE C — RACING ================= -->
  <g>
    <rect x="30" y="335" width="440" height="224" rx="10" fill="#ffffff" fill-opacity="0.025" stroke="#44FF88" stroke-opacity="0.45" stroke-width="2"/>
    <text class="zlabel" x="46" y="352" font-size="19" fill="#44FF88">RACING ARENA</text>
    <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
      <rect x="62" y="352" width="196" height="176" rx="10"/>
      <rect x="262" y="352" width="196" height="176" rx="10"/>
    </g>
    <!-- steering wheels -->
    <g fill="none" stroke="#44FF88" stroke-opacity="0.5" stroke-width="4">
      <circle cx="160" cy="470" r="26"/>
      <circle cx="360" cy="470" r="26"/>
      <line x1="160" y1="470" x2="160" y2="496"/>
      <line x1="360" y1="470" x2="360" y2="496"/>
      <line x1="134" y1="470" x2="186" y2="470"/>
      <line x1="334" y1="470" x2="386" y2="470"/>
    </g>
  </g>

  <!-- ================= ZONE D — NOSTALGIA ================= -->
  <g>
    <rect x="530" y="335" width="440" height="224" rx="10" fill="#ffffff" fill-opacity="0.025" stroke="#CC44FF" stroke-opacity="0.45" stroke-width="2"/>
    <text class="zlabel" x="546" y="352" font-size="19" fill="#CC44FF">90'S NOSTALGIA</text>
    <g fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
      <rect x="572" y="352" width="196" height="176" rx="10"/>
      <rect x="762" y="352" width="196" height="176" rx="10"/>
    </g>
    <!-- arcade cabinets -->
    <g fill="none" stroke="#CC44FF" stroke-opacity="0.5" stroke-width="3">
      <path d="M640 400 h60 v60 h-60 z"/>
      <path d="M650 440 v20 M690 440 v20"/>
      <path d="M830 400 h60 v60 h-60 z"/>
      <path d="M840 440 v20 M880 440 v20"/>
    </g>
  </g>

  <!-- ================= BOTTOM STRIP ================= -->
  <g>
    <rect x="30" y="576" width="940" height="2" fill="#FF6B00" fill-opacity="0.25"/>
    <g class="tiny" font-size="12" fill="#888880">
      <circle cx="46" cy="600" r="7" fill="#22C55E"/>
      <text x="62" y="604">FREE</text>
      <circle cx="140" cy="600" r="7" fill="#EF4444"/>
      <text x="156" y="604">BOOKED</text>
      <text x="250" y="604">TAP A GREEN STATION TO BOOK IT</text>
    </g>
    <text class="zlabel" x="970" y="606" font-size="18" fill="#F5F0E8" fill-opacity="0.35" text-anchor="end">GROUND FLOOR PLAN</text>
  </g>
</svg>
